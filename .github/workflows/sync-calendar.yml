name: Sincronizzazione Giornaliera Calendario ICS 
on:
  schedule:
    - cron: '0 0 * * *' # Esegue ogni giorno a mezzanotte UTC 
  workflow_dispatch: # Permette l'avvio manuale 
jobs:
  sync_ics:
    runs-on: ubuntu-latest 
    steps:
      - name: Checkout repository 
        uses: actions/checkout@v4 
        with:
          token: ${{ secrets.GH_PAT }} # NON SOSTITUIRE. Usa automaticamente il Token per consentire il push 
      
      - name: Configure Git User 
        run: |
          git config user.name "GitHub Actions Bot" 
          git config user.email "actions@github.com" 
      
      - name: Download latest ICS file 
        env:
          CALENDAR_URL: "https://calendar.google.com/calendar/ical/7c0d54c8fa499b1b991499814860f2094eee53babcee50f8e75ef45b4b64c223%40group.calendar.google.com/public/basic.ics" 
        run: |
          echo "Scarico il file ICS da Google Calendar..." 
          curl -sS -L "$CALENDAR_URL" -o "calendar/basics.ics" 
          echo "Download completato." 
      
      - name: Commit and Push if changed 
        run: |
          if [ -n "$(git status --porcelain)" ]; then 
            echo "Modifiche rilevate. Commit in corso..." 
            git add calendar/basics.ics
            git commit -m "🤖 Sync: Aggiornamento calendario club micologico - $(date +%F_%H:%M)" 
            git push 
            echo "Aggiornamento completato con successo." 
          else
            echo "Nessuna modifica rilevata nel file ICS. Non faccio il commit." 
          fi
